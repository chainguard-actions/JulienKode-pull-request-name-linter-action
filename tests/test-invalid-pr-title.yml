name: Test invalid PR title fails linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Inject invalid PR event payload
        run: |
          cat "$GITHUB_WORKSPACE/tests/fixtures/events/invalid-pr-event.json" > "$GITHUB_EVENT_PATH"
      - name: Run action with invalid PR title (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          configuration-path: ${{ github.workspace }}/tests/fixtures/commitlint/commitlint.config.js
      - name: Assert action failed for invalid title
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid PR title with uppercase scope, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid PR title"
