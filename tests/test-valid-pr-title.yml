name: Test valid PR title
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create event payload with valid PR title
        run: |
          mkdir -p /tmp/event
          cat > /tmp/event/pull_request.json << 'EOF'
          {
            "action": "opened",
            "pull_request": {
              "number": 1,
              "title": "feat(scope): add new feature",
              "body": "This is a test PR"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/event/pull_request.json" >> $GITHUB_ENV

      - name: Create commitlint config
        run: |
          cat > /tmp/commitlint.config.js << 'EOF'
          module.exports = { rules: { "scope-case": [2, "always", "lower-case"] } };
          EOF

      - id: action
        uses: .
        with:
          configuration-path: /tmp/commitlint.config.js

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with a valid PR title"
          echo "PASS"
