name: Test no PR context exits gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Inject non-PR event payload
        run: |
          cat "$GITHUB_WORKSPACE/tests/fixtures/events/no-pr-event.json" > "$GITHUB_EVENT_PATH"
      - name: Run action with no PR context
        id: action
        uses: .
        with:
          configuration-path: ${{ github.workspace }}/tests/fixtures/commitlint/commitlint.config.js
      - name: Assert action completed without failure
        run: |
          echo "PASS: action exited gracefully with no PR context"
