name: Test basic usage - no PR context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run pull-request-name-linter-action with default config
        id: action
        uses: .
        # No pull_request payload under workflow_dispatch, so the action
        # exits silently without linting — this is the expected behavior.

      - name: Assert action completed without failure
        run: |
          echo "PASS: action completed successfully with no PR context"
